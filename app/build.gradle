plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation libs.reactiveStreams
    testImplementation libs.testng
    testImplementation libs.assertj.core

    implementation platform(libs.reactor.bom)
    implementation libs.reactor.core
    implementation libs.reactivestreams.tck
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.example.App'
}


tasks.named('test') {
    // Use TestNG for unit tests.
    useTestNG()

    beforeTest { descriptor ->
        println "Running test: ${descriptor.className} -> ${descriptor.name}"
    }

    afterTest { descriptor, result ->
        println "Finished test: ${descriptor.className} -> ${descriptor.name} [${result.resultType}]"
    }
}
